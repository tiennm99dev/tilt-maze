<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1d2433" />
    <meta name="description" content="Tilt your phone to roll a marble through a 3D maze. Shake hard and it flies off the board." />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <title>Tilt Maze</title>
  </head>
  <body>
    <canvas id="stage" aria-label="Maze board"></canvas>

    <div id="hud" class="hud" hidden>
      <div class="hud-stats">
        <span class="pill"
          ><span id="hud-level" class="level-long">Level 1</span
          ><span id="hud-level-short" class="level-short" aria-hidden="true">Lv 1</span></span
        >
        <span class="pill pill-stats"
          ><span class="pill-label">Time</span> <span id="hud-time">0:00.0</span
          ><span id="hud-penalty" class="penalty" aria-hidden="true"></span
          ><span id="hud-falls-group" class="falls"
            ><span class="pill-label">Falls</span> <span id="hud-falls">0</span></span
          ></span
        >
      </div>
      <div class="hud-buttons">
        <div id="tilt-indicator" class="tilt-indicator" data-pitch="0" data-roll="0" title="Board tilt">
          <span class="tilt-dot"></span>
        </div>
        <button id="btn-recalibrate" class="icon-btn" type="button" aria-label="Recalibrate" title="Recalibrate">&#x27F2;</button>
        <button id="btn-mute" class="icon-btn" type="button" aria-label="Mute" title="Mute">&#x266A;</button>
        <button id="btn-pause" class="icon-btn" type="button" aria-label="Pause" title="Pause">&#x275A;&#x275A;</button>
      </div>
    </div>

    <div id="hint" class="hint" hidden></div>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <section id="screen-title" class="screen" role="dialog" aria-modal="true" aria-labelledby="title-heading">
      <div class="panel">
        <h1 id="title-heading">Tilt Maze</h1>
        <p class="tagline">Tilt your phone to roll the marble to the green ring. Shake hard and it jumps &mdash; maybe right off the board.</p>
        <button id="btn-play" class="btn primary" type="button">Play</button>
        <div class="row">
          <button id="btn-levels" class="btn" type="button">Levels</button>
          <button id="btn-endless" class="btn" type="button">Endless</button>
          <button id="btn-settings" class="btn" type="button">Settings</button>
        </div>
        <p id="title-error" class="error" role="alert" hidden></p>
        <p class="small">No phone? Use the arrow keys or WASD, Space to jump, Esc to pause, or drag the board.</p>
      </div>
    </section>

    <section id="screen-levelSelect" class="screen" role="dialog" aria-modal="true" aria-labelledby="levels-heading" hidden>
      <div class="panel">
        <h2 id="levels-heading">Levels</h2>
        <div id="level-grid" class="level-grid"></div>
        <button id="btn-levels-back" class="btn" type="button">Back</button>
      </div>
    </section>

    <section id="screen-settings" class="screen" role="dialog" aria-modal="true" aria-labelledby="settings-heading" hidden>
      <div class="panel">
        <h2 id="settings-heading">Settings</h2>
        <label class="field">
          <span>Sensitivity <output id="sensitivity-value">1.0&times;</output></span>
          <input id="sensitivity" type="range" min="0.5" max="2" step="0.1" value="1" />
        </label>
        <label class="field checkbox">
          <input id="invert" type="checkbox" />
          <span>Invert tilt</span>
        </label>
        <button id="btn-settings-back" class="btn" type="button">Back</button>
      </div>
    </section>

    <section id="screen-loading" class="screen" role="dialog" aria-modal="true" aria-labelledby="loading-text" hidden>
      <div class="panel" tabindex="-1">
        <div class="spinner" aria-hidden="true"></div>
        <p id="loading-text" role="status">Loading&hellip;</p>
      </div>
    </section>

    <section
      id="screen-paused"
      class="screen"
      role="dialog"
      aria-modal="true"
      aria-labelledby="paused-heading"
      aria-describedby="paused-level"
      hidden
    >
      <div class="panel">
        <h2 id="paused-heading">Paused</h2>
        <p id="paused-level" class="small paused-level"></p>
        <button id="btn-resume" class="btn primary" type="button">Resume</button>
        <div class="row">
          <button id="btn-retry" class="btn" type="button">Retry</button>
          <button id="btn-pause-settings" class="btn" type="button">Settings</button>
          <button id="btn-pause-levels" class="btn" type="button">Levels</button>
          <button id="btn-pause-menu" class="btn" type="button">Menu</button>
        </div>
      </div>
    </section>

    <section
      id="screen-won"
      class="screen"
      role="dialog"
      aria-modal="true"
      aria-labelledby="win-title"
      aria-describedby="win-time win-details win-best"
      hidden
    >
      <div class="panel">
        <h2 id="win-title">Level complete</h2>
        <p class="win-time" id="win-time">0:00.0</p>
        <p id="win-details" class="small"></p>
        <p id="win-best" class="best" hidden></p>
        <button id="btn-next" class="btn primary" type="button">Next level</button>
        <div class="row">
          <button id="btn-win-retry" class="btn" type="button">Retry</button>
          <button id="btn-win-levels" class="btn" type="button">Levels</button>
          <button id="btn-win-menu" class="btn" type="button">Menu</button>
        </div>
      </div>
    </section>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
